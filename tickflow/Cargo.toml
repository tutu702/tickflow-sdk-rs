[package]
name = "tickflow"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "gzip",
    "deflate",
    "native-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
url = "2.5"

[dev-dependencies]
wiremock = "0.6"
